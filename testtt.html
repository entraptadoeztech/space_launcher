<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>shushhhhhhh</title>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.js"></script>

<script>
(async () => {

    const FOSS = "https://oldprodigy.onrender.com";
    const FOSS_BASE = FOSS.endsWith("/") ? FOSS : FOSS + "/";

    /* --------------------------------
       Keep the hosted page at /
    -------------------------------- */

    try {
        history.replaceState(null, "", "/");
    } catch (_) {}


    /* --------------------------------
       Initialize libcurl
    -------------------------------- */

    await libcurl.load_wasm(
        "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.wasm"
    );

    libcurl.transport = "wisp";

    libcurl.set_websocket(
        "wss://cdn.northstreetumc.org/"
    );


    /* --------------------------------
       Save native browser APIs
    -------------------------------- */

    const nativeFetch = window.fetch.bind(window);
    const NativeXHR = window.XMLHttpRequest;


    /* --------------------------------
       libcurl -> browser Response
    -------------------------------- */

    async function curlFetch(url, options = {}) {
        const requestURL =
            typeof url === "string"
                ? url
                : url && url.url
                    ? url.url
                    : String(url);

        console.log("[WISP FETCH]", requestURL);

        const result = await libcurl.fetch(requestURL, {
            method: options.method || "GET",
            headers: options.headers || {},
            body: options.body
        });

        const body = await result.arrayBuffer();

        return new Response(body, {
            status: result.status,
            statusText: result.statusText,
            headers: result.headers
        });
    }


    /* --------------------------------
       Intercept fetch()

       FOSS requests go through libcurl/WISP
       instead of browser CORS.
    -------------------------------- */

    window.fetch = async function(input, options) {
        let url = typeof input === "string"
            ? input
            : input && input.url
                ? input.url
                : "";

        if (!url) {
            return nativeFetch(input, options);
        }

        try {
            const parsed = new URL(url, location.href);

            const isOnRenderHost =
                parsed.hostname === "onrender.com" ||
                parsed.hostname.endsWith(".onrender.com");

            if (isOnRenderHost) {
                return await curlFetch(parsed.href, options || {});
            }
        } catch (_) {}

        return nativeFetch(input, options);
    };


    /* --------------------------------
       Fetch homepage
    -------------------------------- */

    const response = await libcurl.fetch(FOSS_BASE);

    if (!response.ok) {
        throw new Error("FOSS returned HTTP " + response.status);
    }

    let html = await response.text();

    console.log("FOSS HTML:", html.length, "bytes");


    /* --------------------------------
       Parse
    -------------------------------- */

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");


    /* --------------------------------
       URL rewriting
    -------------------------------- */

    function fixURL(value) {
        if (!value) return value;

        value = value.trim();

        if (
            value.startsWith("data:") ||
            value.startsWith("blob:") ||
            value.startsWith("javascript:") ||
            value.startsWith("mailto:") ||
            value.startsWith("#")
        ) {
            return value;
        }

        try {
            if (value.startsWith("//")) {
                return "https:" + value;
            }

            if (value.startsWith("/")) {
                return FOSS + value;
            }

            return new URL(value, FOSS_BASE).href;
        } catch (_) {
            return value;
        }
    }


    /* --------------------------------
       HTML resources
    -------------------------------- */

    const attributes = [
        "src",
        "href",
        "poster",
        "action",
        "formaction",
        "cite",
        "background",
        "data-src",
        "data-href",
        "data-url"
    ];

    for (const attribute of attributes) {
        for (const element of doc.querySelectorAll("[" + attribute + "]")) {
            const value = element.getAttribute(attribute);
            if (!value) continue;
            element.setAttribute(attribute, fixURL(value));
        }
    }


    /* --------------------------------
       srcset
    -------------------------------- */

    for (const element of doc.querySelectorAll("[srcset]")) {
        const value = element.getAttribute("srcset");
        if (!value) continue;

        const rewritten = value
            .split(",")
            .map(item => {
                const parts = item.trim().split(/\s+/);
                if (!parts.length) return item;
                parts[0] = fixURL(parts[0]);
                return parts.join(" ");
            })
            .join(", ");

        element.setAttribute("srcset", rewritten);
    }


    /* --------------------------------
       Inline CSS
    -------------------------------- */

    for (const element of doc.querySelectorAll("[style]")) {
        let style = element.getAttribute("style");
        if (!style) continue;

        style = style.replace(
            /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,
            (match, quote, url) => "url(" + quote + fixURL(url) + quote + ")"
        );

        element.setAttribute("style", style);
    }


    /* --------------------------------
       Inline JavaScript URLs
    -------------------------------- */

    for (const script of doc.querySelectorAll("script")) {
        if (!script.textContent) continue;

        let code = script.textContent;

        code = code.replace(
            /(["'`])\/(?!\/)([^"'`\r\n]*)\1/g,
            (match, quote, path) => quote + FOSS + "/" + path + quote
        );

        code = code.replace(
            /(["'`])\/\/([^"'`\r\n]+)\1/g,
            (match, quote, host) => quote + "https://" + host + quote
        );

        script.textContent = code;
    }


    /* --------------------------------
       Remove <base>
    -------------------------------- */

    for (const base of doc.querySelectorAll("base")) {
        base.remove();
    }


    /* --------------------------------
       Serialize
    -------------------------------- */

    const output = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;

    console.log("Rewritten FOSS:", output.length, "bytes");


    /* --------------------------------
       Execute directly
    -------------------------------- */

    document.open();
    document.write(output);
    document.close();

})();
</script>

</body>
</html>
